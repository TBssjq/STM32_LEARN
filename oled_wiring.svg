<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Consolas,Menlo,'Microsoft YaHei',monospace">
  <rect width="980" height="620" fill="#fbfbf9"/>
  <text x="490" y="44" text-anchor="middle" font-size="20" font-weight="bold" fill="#111" font-family="'Microsoft YaHei',sans-serif">STM32F103C8T6 &#8596; SSD1306 OLED (I2C) 接线图</text>
  <text x="490" y="68" text-anchor="middle" font-size="12" fill="#777" font-family="'Microsoft YaHei',sans-serif">OLED 只占 4 根线：VDD / GND / SCK / SDA；SCK 就是 I2C 的 SCL</text>

  <!-- ============ 蓝板 ============ -->
  <rect x="70" y="140" width="260" height="260" rx="6" fill="#1c5aa8" stroke="#0b2f5c" stroke-width="2"/>
  <rect x="170" y="116" width="60" height="26" rx="3" fill="#c9ced6" stroke="#8f959d"/>
  <text x="200" y="110" text-anchor="middle" font-size="10" fill="#8f959d" font-family="sans-serif">USB</text>
  <text x="200" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" font-family="sans-serif">STM32F103C8T6</text>
  <text x="200" y="258" text-anchor="middle" font-size="10" fill="#a8c9ee" font-family="sans-serif">Blue Pill</text>
  <text x="200" y="320" text-anchor="middle" font-size="10" fill="#8fb4dd" font-family="sans-serif">I2C1 = PB6(SCL) / PB7(SDA)</text>
  <text x="200" y="340" text-anchor="middle" font-size="10" fill="#8fb4dd" font-family="sans-serif">空闲脚 PA0 可接 LED（见备注 3）</text>

  <!-- 右侧排针 -->
  <rect x="330" y="150" width="20" height="250" rx="3" fill="#23262b"/>
  <g fill="#d9b34a">
    <rect x="332" y="174" width="16" height="12" rx="2"/>
    <rect x="332" y="204" width="16" height="12" rx="2"/>
    <rect x="332" y="234" width="16" height="12" rx="2"/>
    <rect x="332" y="264" width="16" height="12" rx="2"/>
    <rect x="332" y="294" width="16" height="12" rx="2"/>
    <rect x="332" y="324" width="16" height="12" rx="2"/>
    <rect x="332" y="354" width="16" height="12" rx="2"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="end">
    <text x="324" y="185" fill="#ffd75e">3V3</text>
    <text x="324" y="215" fill="#ffd75e">GND</text>
    <text x="324" y="245" fill="#8fa4b8">5V</text>
    <text x="324" y="275" fill="#8fa4b8">PB9</text>
    <text x="324" y="305" fill="#8fa4b8">PB8</text>
    <text x="324" y="335" fill="#2f9e44">PB7</text>
    <text x="324" y="365" fill="#f08c00">PB6</text>
  </g>

  <!-- ============ OLED 模块 ============ -->
  <rect x="700" y="200" width="200" height="220" rx="5" fill="#0f2b45" stroke="#071624" stroke-width="2"/>
  <rect x="712" y="212" width="176" height="128" rx="3" fill="#0a1a28"/>
  <text x="800" y="238" text-anchor="middle" font-size="9" fill="#4da3ff" font-family="sans-serif">STM32F103C8T6</text>
  <text x="800" y="254" text-anchor="middle" font-size="9" fill="#4da3ff" font-family="sans-serif">SSD1306 128x64 I2C</text>
  <text x="800" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#7fc0ff" font-family="sans-serif">Hello, OLED!</text>
  <text x="800" y="320" text-anchor="middle" font-size="12" fill="#4da3ff" font-family="sans-serif">CNT: 000123</text>
  <text x="800" y="366" text-anchor="middle" font-size="10" fill="#6f8ea8" font-family="sans-serif">0.96"  128&#215;64  SSD1306</text>
  <text x="800" y="386" text-anchor="middle" font-size="10" fill="#6f8ea8" font-family="sans-serif">地址 0x3C (HAL 用 0x78)</text>
  <g fill="#d9b34a">
    <rect x="678" y="242" width="22" height="6"/>
    <rect x="678" y="282" width="22" height="6"/>
    <rect x="678" y="322" width="22" height="6"/>
    <rect x="678" y="362" width="22" height="6"/>
  </g>
  <g font-size="10" font-weight="bold" text-anchor="middle" fill="#9fd0ff">
    <text x="689" y="236">GND</text>
    <text x="689" y="276">VDD</text>
    <text x="689" y="316">SCK</text>
    <text x="689" y="356">SDA</text>
  </g>

  <!-- ============ 4 根杜邦线 ============ -->
  <g fill="none" stroke-width="3.5" stroke-linecap="round">
    <path d="M346,180 C470,180 560,300 676,290" stroke="#e03131"/>
    <path d="M346,210 C470,210 570,240 676,250" stroke="#2b2b2b"/>
    <path d="M346,330 C470,330 560,380 676,370" stroke="#2f9e44"/>
    <path d="M346,360 C480,360 560,320 676,330" stroke="#f08c00"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.8">
    <circle cx="346" cy="180" r="4.5" fill="#e03131"/><circle cx="676" cy="290" r="4.5" fill="#e03131"/>
    <circle cx="346" cy="210" r="4.5" fill="#2b2b2b"/><circle cx="676" cy="250" r="4.5" fill="#2b2b2b"/>
    <circle cx="346" cy="330" r="4.5" fill="#2f9e44"/><circle cx="676" cy="370" r="4.5" fill="#2f9e44"/>
    <circle cx="346" cy="360" r="4.5" fill="#f08c00"/><circle cx="676" cy="330" r="4.5" fill="#f08c00"/>
  </g>

  <!-- ============ 备注 ============ -->
  <rect x="70" y="430" width="830" height="170" rx="8" fill="#ffffff" stroke="#dcdcd4"/>
  <text x="94" y="458" font-size="15" font-weight="bold" fill="#111" font-family="sans-serif">接线与驱动说明</text>
  <g font-size="12.5" fill="#444" font-family="sans-serif">
    <text x="94" y="484">1. VDD &#8594; 3.3V（不要接 5V）；GND &#8594; GND；SCK &#8594; PB6；SDA &#8594; PB7。模块板载 4.7kΩ 上拉，无需外加。</text>
    <text x="94" y="508">2. 地址默认 0x3C（HAL 传 0x78）；若全屏不亮，把 ssd1306.h 的 SSD1306_I2C_ADDR 改成 0x7A 再试。</text>
    <text x="94" y="532" fill="#7048e8">3. 可选 LED：PA0 &#8594; LED 长脚(阳极)，短脚(阴极) &#8594; GND。绿灯/蓝灯可省电阻，红灯必须串 1kΩ。</text>
    <text x="94" y="556">4. 屏幕缓冲 1KB，整屏刷新在 100kHz I2C 下约 100ms；想更快可在 CubeMX 把 I2C1 改成 400kHz。</text>
    <text x="94" y="580" fill="#888">5. 只用 OLED 不想接 LED：把 main.c 里的 LED_Init / LED_On / LED_Toggle 删掉即可，其余不用动。</text>
  </g>
</svg>
